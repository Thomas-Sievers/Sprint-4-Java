spring.application.name=nous_sight

# H2 (default profile) - in-memory copy of the Oracle schema
spring.datasource.url=jdbc:h2:mem:noussight;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables/sequences created from the entities, then filled by data.sql (sprint4.sql DML)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
